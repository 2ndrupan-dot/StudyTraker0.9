<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>StudyTrack</title>
    <meta name="description" content="Smart study planner with hierarchical subjects, daily plan, revisions, marks and rich note pages." />
    <meta name="theme-color" content="#5149f3" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="StudyTrack" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>

    <!-- Runs before the shell below is parsed: marks whether the brand
         logo/title intro has already played this browser session. First-ever
         open of the site plays the full intro; every reload after that
         within the same tab session only shows the plain spinner. -->
    <script>
      (function () {
        try {
          var KEY = '@study_splash_seen_session';
          if (sessionStorage.getItem(KEY)) {
            document.documentElement.classList.add('as-reload');
          } else {
            sessionStorage.setItem(KEY, '1');
          }
        } catch (e) { /* ignore */ }
      })();
    </script>

    <!-- Static pre-hydration app shell: painted by the browser instantly from
         raw HTML/CSS, before React, Vite, or any JS module has run. This is
         what a reload shows first, so it must never be blank/white. It fades
         out once real content is ready (see src/lib/appShell.ts). -->
    <style>
      #app-shell-loader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        background: #f4f4fb;
        transition: opacity 0.26s ease;
        overflow: hidden;
      }
      #app-shell-loader .as-content {
        filter: blur(3px);
        opacity: 0.55;
        transform: scale(1.01);
      }
      #app-shell-loader .as-header {
        height: 120px;
        background: linear-gradient(135deg, #6d63f5 0%, #9450d6 100%);
        border-radius: 0 0 24px 24px;
        padding: 20px;
        box-sizing: border-box;
      }
      #app-shell-loader .as-header-line {
        height: 14px;
        width: 40%;
        background: rgba(255,255,255,0.55);
        border-radius: 7px;
        margin-bottom: 10px;
      }
      #app-shell-loader .as-header-line.short {
        width: 25%;
        height: 22px;
      }
      #app-shell-loader .as-body {
        max-width: 420px;
        margin: 18px auto 0;
        padding: 0 18px;
      }
      #app-shell-loader .as-card {
        background: #ffffff;
        border: 1px solid #e7e7f2;
        border-radius: 18px;
        padding: 16px;
        margin-bottom: 14px;
      }
      #app-shell-loader .as-line {
        height: 12px;
        background: #eceaf7;
        border-radius: 6px;
        margin-bottom: 8px;
      }
      #app-shell-loader .as-line.w60 { width: 60%; }
      #app-shell-loader .as-line.w40 { width: 40%; }
      #app-shell-loader .as-line.w90 { width: 90%; }
      #app-shell-loader .as-bar {
        height: 8px;
        width: 100%;
        background: #eceaf7;
        border-radius: 999px;
      }
      #app-shell-loader .as-nav {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 68px;
        background: #ffffff;
        border-top: 1px solid #e7e7f2;
        display: flex;
        align-items: center;
        justify-content: space-around;
        padding: 0 12px;
        box-sizing: border-box;
      }
      #app-shell-loader .as-nav-item {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        background: #ddd9f2;
      }
      #app-shell-loader .as-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 45%, #d946ef 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      /* Spinner pulled out of the center group and anchored to the bottom,
         matching BrandedLoadingScreen.tsx (React component used post-login). */
      #app-shell-loader .as-spinner {
        position: absolute !important;
        bottom: 64px;
        left: 50%;
        transform: translateX(-50%);
      }
      #app-shell-loader .as-logo {
        position: relative;
        width: 76px;
        height: 76px;
        border-radius: 26px;
        background: linear-gradient(135deg, #6d63f5 0%, #b24bd6 100%);
        border: 1px solid rgba(255,255,255,0.4);
        box-shadow: 0 14px 32px rgba(30,20,80,0.4), 0 0 0 6px rgba(255,255,255,0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        animation: as-logo-in 0.6s cubic-bezier(.22,1,.36,1) 0.05s forwards;
      }
      #app-shell-loader .as-logo svg {
        width: 34px;
        height: 34px;
        filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25));
      }
      #app-shell-loader .as-title {
        color: #ffffff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.02em;
        text-shadow: 0 2px 10px rgba(0,0,0,0.25);
        opacity: 0;
        animation: as-title-in 0.5s cubic-bezier(.22,1,.36,1) 0.62s forwards;
      }
      #app-shell-loader .as-spinner {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 3px solid rgba(255,255,255,0.28);
        border-top-color: #ffffff;
        opacity: 0;
        animation: as-spinner-in 0.4s ease 1.05s forwards, as-spin 0.7s linear infinite 1.05s;
      }
      @keyframes as-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes as-logo-in {
        from { opacity: 0; transform: translateY(28px) scale(0.92); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes as-title-in {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes as-spinner-in {
        to { opacity: 1; }
      }

      /* Reload within the same session: skip the brand intro entirely and
         just show a plain spinner (no logo, no title, no entrance delay). */
      html.as-reload #app-shell-loader .as-logo,
      html.as-reload #app-shell-loader .as-title {
        display: none;
      }
      html.as-reload #app-shell-loader .as-overlay {
        background: rgba(20, 16, 40, 0.16);
      }
      html.as-reload #app-shell-loader .as-spinner {
        border-color: rgba(81, 73, 243, 0.18);
        border-top-color: #5149f3;
        animation: as-spin 0.7s linear infinite;
        opacity: 1;
      }
    </style>
    <div id="app-shell-loader">
      <div class="as-content">
        <div class="as-header">
          <div class="as-header-line short"></div>
          <div class="as-header-line"></div>
        </div>
        <div class="as-body">
          <div class="as-card">
            <div class="as-line w40"></div>
            <div class="as-line w90"></div>
            <div class="as-bar"></div>
          </div>
          <div class="as-card">
            <div class="as-line w60"></div>
            <div class="as-line w40"></div>
          </div>
          <div class="as-card">
            <div class="as-line w90"></div>
            <div class="as-line w60"></div>
          </div>
        </div>
        <div class="as-nav">
          <div class="as-nav-item"></div>
          <div class="as-nav-item"></div>
          <div class="as-nav-item"></div>
          <div class="as-nav-item"></div>
          <div class="as-nav-item"></div>
        </div>
      </div>
      <div class="as-overlay">
        <div class="as-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
          </svg>
        </div>
        <div class="as-title">StudyTrack</div>
        <div class="as-spinner"></div>
      </div>
    </div>
    <!-- Capture the PWA install prompt before React mounts so the browser's
         native mini-infobar never appears on any page (including login). -->
    <script>
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallEvent = e;
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
